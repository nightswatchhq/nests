# yatr - https://github.com/cargopete/yatr
#
# Task names are the same across every nuthatch-org repo, so `yatr ci` means
# the same thing wherever you are. Note that `ci` is deliberately not called
# `check`: `yatr check` is a builtin that validates this file, and it shadows
# any task of that name without warning.

# index.json is the canonical list of nests and the website builds from it, so
# the tasks here are about that file being true rather than about a build.

[settings]
cache = true

[tasks.index]
desc = "Fail if index.json is not valid JSON"
run = ["jq empty index.json"]
sources = ["index.json"]

[tasks.readme]
desc = "Regenerate README.md from index.json"
run = ["scripts/render-readme.sh"]
sources = ["index.json", "scripts/render-readme.sh"]
no_cache = true

[tasks.drift]
desc = "Fail if README.md is stale against index.json"
shell = true
sources = ["index.json", "README.md", "scripts/render-readme.sh"]
run = ["scripts/render-readme.sh && git diff --exit-code -- README.md"]

[tasks.repos]
desc = "Fail if an available nest offers neither a repo to clone nor a command to run"
shell = true
sources = ["index.json"]
run = ['''
bad=$(jq -r '[.nests[] | select(.status == "available" and (.repo // "") == "" and (.command // "") == "") | .id] | join(", ")' index.json)
if [ -n "$bad" ]; then echo "available, but no repo and no command: $bad"; exit 1; fi
jq -r '"\(.nests | length) nests, \([.nests[] | select(.status == "available")] | length) available, each reachable"' index.json
''']

[tasks.links]
desc = "Fail if a relative markdown link points at a file that is not there"
shell = true
sources = ["**/*.md"]
run = ['''
missing=0
for f in $(git ls-files '*.md'); do
  d=$(dirname "$f")
  for l in $(grep -oE '\]\([^)]+\)' "$f" | sed 's/^](//;s/)$//' | grep -vE '^(https?:|mailto:|#|<)' | sed 's/#.*$//'); do
    [ -z "$l" ] && continue
    if [ ! -e "$d/$l" ]; then echo "broken: $f -> $l"; missing=$((missing+1)); fi
  done
done
if [ "$missing" -ne 0 ]; then echo "$missing broken relative link(s)"; exit 1; fi
echo "all relative markdown links resolve"
''']

[tasks.ci]
desc = "What CI runs: index, repos, drift, links"
depends = ["index", "repos", "drift", "links"]
run = []
